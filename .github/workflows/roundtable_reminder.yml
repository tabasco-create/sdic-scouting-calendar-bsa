name: Roundtable reminder
# Posts one Slack message at the start of each month with that month's Coastal Sage Roundtable date
# (about 8am Pacific on the 1st). docs/roundtable_reminder.json remembers the last month announced.
on:
  schedule:
    - cron: "7 16 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python roundtable.py --remind --slack-payload rt_remind.json
      - name: Post to Slack
        if: hashFiles('rt_remind.json') != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL is not set, so no Slack message was sent."
            exit 1
          fi
          curl -fsS -X POST -H 'Content-type: application/json' --data @rt_remind.json "$SLACK_WEBHOOK_URL"
      - name: Remember the reminder
        # runs only if the Slack post worked, so a failed post is retried the next day
        run: |
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add docs/roundtable_reminder.json
          git diff --staged --quiet || (git commit -m "Roundtable reminder sent" && git pull -q --rebase && git push)
